[project]
name = "bionova"
version = "1.0.0"
description = "Biomedical Literature Mining and Hypothesis Discovery"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.32.0",
    "networkx>=3.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.1.0",
]

[project.optional-dependencies]
nlp = ["scispacy>=0.5.4", "spacy>=3.7.0"]
llm = ["google-generativeai>=0.5.0"]
full = ["numpy>=1.24.0", "pandas>=2.0.0", "scispacy>=0.5.4", "spacy>=3.7.0", "google-generativeai>=0.5.0"]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_bionova.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
